uto}.chatlog{max-height:138px;overflow:auto;background:#10232acc;border:1px solid #a7a07977;border-bottom:0;border-radius:7px 7px 0 0;padding:8px 10px;font-size:11px;line-height:1.6}.chatrow{display:flex}.chatrow input{flex:1;min-width:0;background:#e7e2d4;color:#2a3031;border:0;border-radius:0 0 0 7px;padding:11px}.chatrow button{border:0;background:#c39b61;color:#1e201e;border-radius:0 0 7px 0;padding:0 14px;font-weight:bold;cursor:pointer}.chatlog div{margin:2px 0}.chatlog b{color:#e2c68e}.minimap{position:absolute;right:18px;top:74px;width:170px;height:170px;background:#142b34dc;border:1px solid #d2b886aa;border-radius:8px;padding:8px;z-index:4;pointer-events:none}.minimap canvas{width:100%;height:100%}.badge{position:absolute;top:255px;right:18px;background:#182e35d9;border:1px solid #b29a6c88;border-radius:5px;font-size:11px;padding:7px 10px;pointer-events:none}.overlay{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 43%,#050d1685 100%)}@media(max-width:700px){.top h1{font-size:18px}.top{top:8px;left:8px;padding:9px}.top p{font-size:10px}.right{top:75px;right:8px}.uiBtn{padding:8px;font-size:11px}.minimap{width:100px;height:100px;top:120px;right:8px}.badge{display:none}.talk{bottom:45px;width:65vw;left:8px}.guide{bottom:6px;left:8px;font-size:10px}.status{display:none}}
